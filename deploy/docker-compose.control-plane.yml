services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - codeflow-mongo:/data/db

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    env_file: production.env
    depends_on:
      - mongo
    expose:
      - "4000"

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:8080"

volumes:
  codeflow-mongo:
